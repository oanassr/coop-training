name: Keep Supabase Awake

# نبضة تمنع توقّف مشروع Supabase المجاني (يتوقف بعد ~7 أيام من الخمول).
# تستعلم استعلاماً خفيفاً من القاعدة كل 3 أيام.

on:
  schedule:
    - cron: '0 6 */3 * *' # كل 3 أيام الساعة 06:00 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
            "${{ secrets.VITE_SUPABASE_URL }}/rest/v1/settings?select=id&limit=1")
          echo "HTTP $code"
          if [ "$code" -ge 500 ]; then exit 1; fi
